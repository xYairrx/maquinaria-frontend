<!--
  Espejo de `dashboard.html`. Mismas rejillas, mismos cortes responsivos, mismas alturas.

  ACCESIBILIDAD: el esqueleto es DECORACIÓN, y por eso todo el bloque va `aria-hidden`. Lo
  que sustituye al texto de «Cargando…» para quien no ve la pantalla es el `role="status"`
  con el texto en `sr-only` de abajo: sin él, un lector de pantalla anunciaría una región
  vacía y quien lo usa no sabría que hay algo en camino. `aria-busy` en el contenedor dice
  que lo que hay dentro está a medias.
-->
<div class="mx-auto flex flex-col gap-5" aria-busy="true">
  <p role="status" class="sr-only">{{ t().comun.cargando }}</p>

  <div aria-hidden="true" class="flex flex-col gap-5">
    <!-- Indicadores: 1 / 2 / 4 columnas, igual que los de verdad. -->
    <ul class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
      @for (tarjeta of tarjetas; track tarjeta) {
        <li class="tarjeta-indicador" [class.tarjeta-indicador-destacada]="tarjeta === 4">
          <div class="flex items-start justify-between gap-2">
            <!-- La etiqueta: una barra corta de 11 px de alto, como el texto que sustituye. -->
            <div class="esqueleto h-3 w-24" [class.esqueleto-inverso]="tarjeta === 4"></div>
            <div class="esqueleto size-4 shrink-0" [class.esqueleto-inverso]="tarjeta === 4"></div>
          </div>

          <!-- La cifra: 30 px de alto, que es lo que ocupa el número. -->
          <div class="esqueleto mt-2 h-7.5 w-20" [class.esqueleto-inverso]="tarjeta === 4"></div>

          <!-- `h-4` y no `h-3`: el pie es texto de 12 px, cuya caja de linea mide 16. -->
          <div class="esqueleto mt-2 h-4 w-32" [class.esqueleto-inverso]="tarjeta === 4"></div>
        </li>
      }
    </ul>

    <!-- Banda de gráfica y avisos, con la misma columna fija de 380 px. -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-[minmax(0,1fr)_380px]">
      <section class="rounded-xl border border-borde bg-superficie p-5">
        <div class="esqueleto h-4 w-40"></div>
        <div class="esqueleto mt-2 h-3 w-72 max-w-full"></div>

        <!--
          `h-44` y `items-end`: exactamente la caja de la gráfica real, para que las barras
          no salten de alto al llegar los datos. Los porcentajes son fijos —no aleatorios—
          para que la silueta no tiemble en cada pasada de detección de cambios.
        -->
        <ul class="mt-5 flex h-44 items-end gap-2 sm:gap-4">
          @for (alto of barras; track $index) {
            <li class="flex h-full flex-1 flex-col items-center justify-end gap-2">
              <div class="esqueleto h-3 w-4"></div>

              <div class="flex w-full flex-1 items-end">
                <div class="esqueleto w-full" [style.height.%]="alto"></div>
              </div>

              <div class="esqueleto h-2.5 w-7"></div>
            </li>
          }
        </ul>
      </section>

      <section class="flex flex-col rounded-xl border border-borde bg-superficie p-5">
        <div class="flex items-center justify-between gap-3">
          <div class="esqueleto h-4 w-36"></div>
          <div class="esqueleto h-5 w-20 rounded-full"></div>
        </div>

        <ul class="mt-4 flex flex-col gap-2">
          @for (aviso of avisos; track aviso) {
            <!--
              Con la utilidad `aviso` de verdad, filete amarillo incluido: es parte de la
              forma, y quitarlo haría que la lista cambiara de aspecto al cargar.
            -->
            <li class="aviso">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0 flex-1">
                  <div class="esqueleto h-3.5 w-40 max-w-full"></div>

                  <!--
                    TRES lineas, con la ultima corta. El detalle de un aviso real envuelve
                    en unas tres a este ancho; con dos, cada elemento quedaba 37 px mas bajo
                    y el salto al cargar se veia.
                  -->
                  <div class="esqueleto mt-2 h-3 w-full"></div>
                  <div class="esqueleto mt-2 h-3 w-full"></div>
                  <div class="esqueleto mt-2 h-3 w-2/3"></div>
                </div>

                <div class="esqueleto h-2.5 w-14 shrink-0"></div>
              </div>
            </li>
          }
        </ul>

        <div class="esqueleto mt-auto h-3.5 w-44 max-w-full"></div>
      </section>
    </div>

    <!-- Tabla: cabecera con chips y cinco filas. -->
    <section class="rounded-xl border border-borde bg-superficie">
      <div
        class="flex flex-col gap-3 border-b border-borde px-4 py-3 md:flex-row md:items-center md:justify-between md:px-5"
      >
        <div class="flex flex-wrap items-center gap-2">
          <div class="esqueleto mr-2 h-4 w-40"></div>

          @for (chip of tarjetas; track chip) {
            <div class="esqueleto h-7 w-20 rounded-lg"></div>
          }
        </div>

        <div class="esqueleto h-8 w-28 rounded-lg"></div>
      </div>

      <div class="px-4 py-2.5 md:px-5">
        <div class="esqueleto h-3 w-full"></div>
      </div>

      @for (fila of filas; track fila) {
        <div
          class="flex items-center justify-between gap-4 border-t border-borde-fila px-4 py-3 md:px-5"
        >
          <div class="min-w-0 flex-1">
            <div class="esqueleto h-3.5 w-48 max-w-full"></div>
            <div class="esqueleto mt-1.5 h-2.5 w-20"></div>
          </div>

          <div class="esqueleto hidden h-3 w-16 shrink-0 sm:block"></div>
          <div class="esqueleto hidden h-3 w-12 shrink-0 sm:block"></div>
          <div class="esqueleto h-6 w-20 shrink-0 rounded-full"></div>
        </div>
      }
    </section>
  </div>
</div>
