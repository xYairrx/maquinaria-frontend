<!--
  Espejo de `tarifas.html`. Lo propio frente a los otros catálogos son las DOS filas de
  chips: el estado y dónde se cobra. Si allí cambian, aquí también.

  El esqueleto es DECORACIÓN y va `aria-hidden`; lo que sustituye al texto de «Cargando…»
  es el `role="status"` en `sr-only`.
-->
<div class="flex flex-col gap-4" aria-busy="true">
  <p role="status" class="sr-only">{{ t().comun.cargando }}</p>

  <div aria-hidden="true" class="flex flex-col gap-4">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="flex flex-col gap-2">
        <div class="flex gap-1.5">
          <div class="esqueleto h-7 w-20 rounded-full"></div>
          <div class="esqueleto h-7 w-20 rounded-full"></div>
          <div class="esqueleto h-7 w-24 rounded-full"></div>
        </div>

        <div class="flex gap-1.5">
          <div class="esqueleto h-7 w-28 rounded-full"></div>
          <div class="esqueleto h-7 w-20 rounded-full"></div>
          <div class="esqueleto h-7 w-20 rounded-full"></div>
        </div>
      </div>

      <div class="esqueleto h-3 w-28"></div>
    </div>

    <section class="rounded-xl border border-borde bg-superficie">
      <div class="border-b border-borde px-4 py-2.5 md:px-5">
        <div class="esqueleto h-3 w-full"></div>
      </div>

      @for (fila of filas; track fila) {
        <div
          class="flex items-start justify-between gap-4 border-b border-borde-fila px-4 py-3 last:border-0 md:px-5"
        >
          <!-- Nombre, código debajo: es como se apila en la celda fijada. -->
          <div class="min-w-0 flex-1">
            <div class="esqueleto h-3.5 w-40 max-w-full"></div>
            <div class="esqueleto mt-1.5 h-2.5 w-20"></div>
          </div>

          <!-- La unidad. -->
          <div class="esqueleto hidden h-3.5 w-16 shrink-0 sm:block"></div>

          <!-- Las etiquetas de dónde se cobra: hasta dos. -->
          <div class="hidden shrink-0 gap-1 sm:flex">
            <div class="esqueleto h-4 w-12 rounded"></div>
            <div class="esqueleto h-4 w-12 rounded"></div>
          </div>

          <div class="flex shrink-0 gap-2">
            <div class="esqueleto h-8 w-16 rounded-lg"></div>
            <div class="esqueleto h-8 w-20 rounded-lg"></div>
          </div>
        </div>
      }
    </section>
  </div>
</div>
