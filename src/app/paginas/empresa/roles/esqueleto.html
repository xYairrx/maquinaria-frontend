<div class="flex flex-col gap-4" aria-busy="true">
  <p role="status" class="sr-only">{{ t().comun.cargando }}</p>

  <ul aria-hidden="true" class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    @for (tarjeta of tarjetas; track tarjeta) {
      <li class="flex flex-col gap-3 rounded-xl border border-borde bg-superficie p-4 md:p-5">
        <div class="flex items-start justify-between gap-2">
          <div class="flex flex-col gap-1.5">
            <div class="esqueleto h-4 w-32"></div>
            <div class="esqueleto h-3 w-20"></div>
          </div>
          <div class="esqueleto h-5 w-24 rounded-full"></div>
        </div>

        <div class="esqueleto h-3.5 w-full"></div>

        <div class="flex gap-6">
          <div class="esqueleto h-3 w-24"></div>
          <div class="esqueleto h-3 w-24"></div>
        </div>

        <div class="flex gap-2">
          <div class="esqueleto h-8 w-32 rounded-lg"></div>
          <div class="esqueleto h-8 w-20 rounded-lg"></div>
        </div>
      </li>
    }
  </ul>
</div>
