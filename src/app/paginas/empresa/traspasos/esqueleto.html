<div class="flex flex-col gap-4" aria-busy="true">
  <p role="status" class="sr-only">{{ t().comun.cargando }}</p>

  <div aria-hidden="true" class="flex flex-col gap-4">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
      <div class="esqueleto h-10 rounded-lg sm:max-w-xs sm:flex-1"></div>
      <div class="flex gap-2">
        <div class="esqueleto h-9 w-36 rounded-lg"></div>
        <div class="esqueleto h-9 w-36 rounded-lg"></div>
      </div>
      <div class="esqueleto h-10 w-40 rounded-lg sm:ms-auto"></div>
    </div>

    <section class="rounded-xl border border-borde bg-superficie">
      <div class="border-b border-borde px-4 py-2.5 md:px-5">
        <div class="esqueleto h-3 w-full"></div>
      </div>

      @for (fila of filas; track fila) {
        <div
          class="flex items-center justify-between gap-4 border-b border-borde-fila px-4 py-3 last:border-0 md:px-5"
        >
          <div class="esqueleto h-3 w-20 shrink-0"></div>
          <div class="esqueleto h-3.5 w-28 min-w-0 max-w-full flex-1"></div>
          <div class="esqueleto hidden h-3 w-28 shrink-0 sm:block"></div>
          <div class="esqueleto hidden h-3 w-32 shrink-0 md:block"></div>
          <div class="esqueleto hidden h-3 w-24 shrink-0 lg:block"></div>
          <div class="esqueleto h-3 w-24 shrink-0"></div>
        </div>
      }
    </section>
  </div>
</div>
