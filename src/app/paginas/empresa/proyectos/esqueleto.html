<!--
  El esqueleto es DECORACIÓN y va `aria-hidden`; lo que sustituye al texto de «Cargando…» es el
  `role="status"` en `sr-only`.
-->
<div class="flex flex-col gap-4" aria-busy="true">
  <p role="status" class="sr-only">{{ t().comun.cargando }}</p>

  <div aria-hidden="true" class="flex flex-col gap-4">
    <section class="rounded-xl border border-borde bg-superficie">
      <div class="border-b border-borde px-4 py-2.5 md:px-5">
        <div class="esqueleto h-3 w-full"></div>
      </div>

      @for (fila of filas; track fila) {
        <div
          class="flex items-start justify-between gap-4 border-b border-borde-fila px-4 py-3 last:border-0 md:px-5"
        >
          <!-- Código, y la obra con sus fechas debajo. -->
          <div class="esqueleto h-3 w-20 shrink-0"></div>
          <div class="esqueleto h-3.5 w-40 min-w-0 max-w-full flex-1"></div>

          <!-- Cliente y ubicación. -->
          <div class="esqueleto hidden h-3 w-32 shrink-0 sm:block"></div>
          <div class="esqueleto hidden h-3 w-28 shrink-0 md:block"></div>

          <!-- Máquinas, el selector de estado y la acción. -->
          <div class="esqueleto h-3.5 w-8 shrink-0"></div>
          <div class="esqueleto hidden h-8 w-28 rounded-lg shrink-0 sm:block"></div>
          <div class="esqueleto size-9 shrink-0 rounded-lg"></div>
        </div>
      }
    </section>
  </div>
</div>
