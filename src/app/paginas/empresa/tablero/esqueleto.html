<div class="flex flex-col gap-6" aria-busy="true">
  <p role="status" class="sr-only">{{ t().comun.cargando }}</p>

  <div aria-hidden="true" class="flex flex-col gap-6">
    @for (bloque of bloques; track bloque.clave) {
      <section class="flex flex-col gap-3">
        <div class="flex flex-col gap-1.5">
          <div class="esqueleto h-4 w-40"></div>
          <div class="esqueleto h-3 w-64"></div>
        </div>

        <ul class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4">
          @for (tarjeta of bloque.tarjetas; track tarjeta) {
            <li class="tarjeta-indicador">
              <div class="esqueleto h-3 w-24"></div>
              <div class="esqueleto mt-2 h-8 w-16"></div>
              <div class="esqueleto mt-2 h-4 w-32"></div>
            </li>
          }
        </ul>
      </section>
    }
  </div>
</div>
