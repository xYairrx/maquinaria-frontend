<!--
  Espejo de `clausulas.html`: dos filas de chips, y la fila con el orden delante del título.
  El esqueleto es DECORACIÓN y va `aria-hidden`; el anuncio es el `role="status"` en `sr-only`.
-->
<div class="flex flex-col gap-4" aria-busy="true">
  <p role="status" class="sr-only">{{ t().comun.cargando }}</p>

  <div aria-hidden="true" class="flex flex-col gap-4">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div class="flex flex-col gap-2">
        <div class="flex gap-1.5">
          <div class="esqueleto h-7 w-20 rounded-full"></div>
          <div class="esqueleto h-7 w-20 rounded-full"></div>
          <div class="esqueleto h-7 w-24 rounded-full"></div>
        </div>

        <div class="flex gap-1.5">
          <div class="esqueleto h-7 w-24 rounded-full"></div>
          <div class="esqueleto h-7 w-28 rounded-full"></div>
          <div class="esqueleto h-7 w-24 rounded-full"></div>
        </div>
      </div>

      <div class="esqueleto h-3 w-28"></div>
    </div>

    <section class="rounded-xl border border-borde bg-superficie">
      <div class="border-b border-borde px-4 py-2.5 md:px-5">
        <div class="esqueleto h-3 w-full"></div>
      </div>

      @for (fila of filas; track fila) {
        <div
          class="flex items-start gap-4 border-b border-borde-fila px-4 py-3 last:border-0 md:px-5"
        >
          <!-- El orden, estrecho y delante. -->
          <div class="esqueleto mt-0.5 h-3.5 w-5 shrink-0"></div>

          <!-- Título con su píldora, y el código debajo: la celda fijada. -->
          <div class="w-44 shrink-0">
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
              <div class="esqueleto h-3.5 w-32 max-w-full"></div>
              <div class="esqueleto h-5 w-20 shrink-0 rounded-full"></div>
            </div>
            <div class="esqueleto mt-1.5 h-2.5 w-16"></div>
          </div>

          <!-- El texto recortado a tres líneas: es lo que da altura a la fila. -->
          <div class="hidden min-w-0 flex-1 flex-col gap-1 sm:flex">
            <div class="esqueleto h-3 w-full"></div>
            <div class="esqueleto h-3 w-full"></div>
            <div class="esqueleto h-3 w-2/3"></div>
          </div>

          <div class="flex shrink-0 gap-1">
            <div class="esqueleto size-9 rounded-lg"></div>
            <div class="esqueleto size-9 rounded-lg"></div>
          </div>
        </div>
      }
    </section>
  </div>
</div>
