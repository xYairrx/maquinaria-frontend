<!--
  Mismo marco de dos columnas que el resto de los accesos, en
  `paginas/acceso/marco-acceso.html`. Sin enlace de contraseña olvidada: aquí todavía no
  se sabe de qué empresa es la cuenta, y esa pantalla vive dentro del subdominio.
-->
<app-marco-acceso [titulo]="t().portal.titulo" [apoyo]="t().portal.apoyo">
  <form [formGroup]="formulario" (ngSubmit)="continuar()" class="flex flex-col gap-4">
    <div class="flex flex-col gap-1.5">
      <!--
        Etiqueta oculta a la vista pero presente en el marcado: el placeholder solo no
        sirve como nombre de campo (WCAG 3.3.2). Ver el acceso de empresa.
      -->
      <label for="empresa" class="sr-only">{{ t().portal.etiquetaEmpresa }}</label>
      <input
        id="empresa"
        type="text"
        formControlName="empresa"
        autocomplete="organization"
        autocapitalize="off"
        spellcheck="false"
        aria-describedby="ayuda-empresa"
        [attr.aria-invalid]="invalido() ? 'true' : null"
        [placeholder]="t().portal.marcadorEmpresa"
        class="campo-acceso"
      />
      <!--
        Esto NO es la etiqueta: es una instrucción, y por eso sigue a la vista. Además es
        el destino de `aria-describedby`, así que ocultarlo o borrarlo dejaría la
        referencia colgando.
      -->
      <p id="ayuda-empresa" class="text-xs text-texto-apagado">
        {{ t().portal.ayudaEmpresa }}
      </p>
    </div>

    @if (invalido()) {
      <p
        role="alert"
        class="rounded-lg border border-amarillo bg-alerta-fondo px-3 py-2.5 text-sm text-alerta-texto"
      >
        {{ t().portal.formatoInvalido }}
      </p>
    }

    <button type="submit" [disabled]="formulario.invalid" class="boton-acceso">
      {{ t().portal.continuar }}
    </button>
  </form>
</app-marco-acceso>
